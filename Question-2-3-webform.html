<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form validation with messages on top: Code example - Accessibility Developer Guide example</title>
        <meta charset="utf-8">
        <style>.control, fieldset {
      margin: 6px 0;
    }
    
    label {
      display: inline-block;
      width: 120px;
      vertical-align: top;
    }
    
    input + label {
      width: auto;
    }
    
    .error, .required {
      color: red;
    }
    
    fieldset ul {
      margin: 0;
    }</style>
    </head>
    <body>
        <h1>Feedback form</h1>
    <form>
        <div class="control">
          <!--[Hye Ran Yoo] 
          I put the for='name' attribute, when listening, NVDA did not say the information of input box, 
          so I connected the label to the input.
          In addition, I put more (required) text and aria-required='true' to show it is a required field.
          'aria-required=true' attribute just give the information, not restrict the function or action.
          I checked the 'validateInput' function in javascript part, this function check the 'full name', 'biography', 'gender' and accept_agbs fields.
          I did not put the required attribute directly in the input element, the browser stops the form, so the error messages from validateInput do not appear.
          -->
          <label for="name">Full name <span class="required">*</span> (required)</label><input id="name" name="name" type="text" aria-required="true"/>
        </div>
        <div class="control">
          <!--[Hye Ran Yoo] I put the for='biography' attribute, (required) text and aria-required='true' and the aria-describedby='biography_desc'.
          The aria-describedby='biography_desc' connect the span tag below the textarea of biography-->
          <label for="biography">Biography (required)</label><textarea id="biography" name="biography" type="text" aria-required="true" aria-describedby="biography_desc"></textarea>
          <!--[Hye Ran Yoo] I put the attribute of id="biography_desc" to connect with upper textarea tag. -->
          <span id="biography_desc">Include examples on your skills in JavaScript.</span>
        </div>

        <!--[Hye Ran Yoo] I put the fieldset tag, because this make the same meaning group.-->
        <fieldset> 
          <!--[Hye Ran Yoo] 
          I changed div tag to legend tag, because legend tag give the information of question.
          In addition, put more '(required)' text. 
          This also give the information as required field.
          -->
          <legend>Gender (required)</legend>
          <div class="control">
            <input id="gender_male" name="gender" type="radio" value="male" /><label for="gender_male">Male</label><!--[Hye Ran Yoo] I put the for='gender_male'.-->
          </div>
          <div class="control">
            <input id="gender_female" name="gender" type="radio" value="female" /><label  for="gender_female">Female</label><!--[Hye Ran Yoo] I put the for='gender_female'.-->
          </div>
        </fieldset>
        <div class="control">
          <!--[Hye Ran Yoo] I put the for='accept_agbs', required text and aria-required='true'. -->
          <input id="accept_agbs" name="accept_agbs" type="checkbox" value="1" aria-required="true"/><label for="accept_agbs">I accept the terms and conditions (required)</label>
        </div>
        <div class="control">
          <input name="validate" type="hidden" value="1" /><input type="submit" value="Register" />
        </div>
      </form>
      
          <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js" integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
          <script>"use strict";
      
      ;
      (function () {
        var validateInput;
      
        $.urlParam = function (name) {
          var results;
          results = new RegExp('[?&]' + name + '=([^&#]*)').exec(window.location.href);
      
          if (results === null) {
            return null;
          } else {
            return decodeURI(results[1]) || null;
          }
        };
      
        validateInput = function validateInput(input, message) {
          var $elementToDescribe, $error, $errorContainer, $fieldset, $input, $referencedElement, value;
          $input = $('[name="' + input + '"]');
      
          if ((value = $.urlParam(input)) === null) {
            if ($('fieldset.errors').length === 0) {
              $('form').prepend('<fieldset class="errors"><legend>Errors</legend><ul></ul></fieldset>');
            }
      
            $referencedElement = null;
            $elementToDescribe = null;
            $errorContainer = $('fieldset.errors ul');
      
            if ($input.is(':radio')) {
              $fieldset = $input.closest('fieldset');
              $elementToDescribe = $fieldset;
              $referencedElement = $input.filter(':first');
            } else {
              $elementToDescribe = $input;
              $referencedElement = $input;
            }
      // R.G. hint: fix next line ;)
            $error = $('<a>' + message + '</a>');
            $error.click(function (e) {
              // If we rely on the link's href pointing to the input's ID, it doesn't trigger forms mode in screen readers
              $referencedElement.focus();
              return e.preventDefault();
            });
            $elementToDescribe.attr('aria-describedby', input + '_description');
            $errorContainer.append('<li>').find('li:last').append($error);
      
            if ($(':not(form):focus').length === 0) {
              // See https://stackoverflow.com/questions/46134247/jquery-setting-focus-doesnt-work-in-ie11/
            
            }
          } else {
            if ($input.is(':checkbox')) {
              $input.attr('checked', true);
            }
      
            if ($input.is(':radio')) {
              return $input.filter('[value="' + value + '"]').attr('checked', true);
            } else {
              return $input.val(value);
            }
          }
        };
      
        $(document).ready(function () {
          if ($.urlParam('validate')) {
            validateInput('name', 'Please enter your name!');
            validateInput('biography', 'Please tell us something about your history!');
            validateInput('gender', 'Please tell us your gender!');
            validateInput('accept_agbs', 'You must accept our terms and conditions!');
      
            if ($('.error').length === 0) {
              return alert('All inputs are valid.');
            }
          }
        });
      }).call(void 0);</script>
                
        </body>
      </html>
